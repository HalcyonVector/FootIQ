services:
  - type: web
    name: footiq
    runtime: python
    plan: free
    branch: main
    # The parquet isn't in git: data/DATA_VERSION points at a GitHub Release
    # asset, which the second step downloads + checksum-verifies. If it fails
    # the build fails, so Render keeps serving the previous working deploy.
    buildCommand: "pip install -r requirements.txt && python scraping/data_release.py fetch"
    # 1 worker: Render's free tier caps the whole instance at 512MB RAM, and
    # each worker is a separate process with its own full copy of the cached
    # dataframes (~300-400MB) plus pandas/pyarrow import
    # overhead — 2 workers would double that and blow the ceiling on a
    # single request. Single-worker is fine for this app's actual traffic.
    # --threads 2: one worker but two request threads (they share the one copy of the
    # data): the boot warm-up runs in the background, and the pages have to be served
    # while API calls wait for it. Two, not four: every in-flight request decodes its
    # own parquet slice, and four at once pushed the 512 MB instance over its limit.
    # --max-requests recycles the worker periodically as a safety net: even
    # with per-request Arrow reads scoped to one tiny partition slice,
    # repeated parquet reads showed a slow, converging RSS creep in local
    # testing (native-allocator fragmentation, not a real Python object leak
    # — confirmed via tracemalloc) that a fresh process resets for free.
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 2 --max-requests 300 --max-requests-jitter 50"
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      # glibc keeps one malloc arena per thread and rarely returns them; two is enough here
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.9"
