name: Keep Render instance warm

# DISABLED by default (schedule trigger removed, workflow_dispatch kept for
# manual on-demand pings). Originally pinged every ~10 min to stop Render's
# free tier from spinning the instance down after ~15 min idle -- but
# Render's free tier pools 750 instance-hours per MONTH across the whole
# workspace (a spun-down service costs nothing; an always-awake one costs
# ~730 hours/month by itself, i.e. nearly the entire shared pool). This repo
# shares that pool with other projects on the same Render account, so
# pinging it awake around the clock would starve them of hours, not just
# this one app. Letting FootIQ sleep when idle is the correct default for a
# shared free-tier budget -- the real fix for cold starts is the app's own
# startup warm-up (app.py), which cuts the cost of an actual cold hit from
# ~40s to ~7s without costing any extra instance-hours (it only runs during
# a boot that was happening anyway).
#
# If a light, bounded ping cadence is ever wanted instead (e.g. a few times
# a day to avoid the worst-case stone-cold hit during likely usage windows,
# at a small, predictable hours cost -- NOT trying to keep it continuously
# warm), re-add a sparse cron here and do the math against the 750-hour pool
# and whatever the other projects on the account actually need first.
on:
  workflow_dispatch: {}  # manual "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live app
        run: curl -sf --max-time 90 https://footiq.onrender.com/ -o /dev/null
