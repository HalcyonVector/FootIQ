name: Keep Render instance warm

# Render's free tier sleeps a service after ~15 idle minutes, so the first visitor
# pays a cold start. FootIQ now has a Render workspace of its own, whose 750 free
# instance-hours a month cover an always-on service (~744 hours in a 31-day month),
# so this pings around the clock.
#
# This is the backup pinger. GitHub starts scheduled runs late or drops them, so the
# main one should be an external monitor (UptimeRobot, every 5 minutes, on
# /api/health); this workflow fills in when that is not set up or is down.
#
# Why a loop and not "cron every 10 minutes": GitHub drops most runs of a
# high-frequency schedule, but it does start low-frequency triggers, if late. So each
# trigger starts ONE job that pings every 4 minutes for up to ~5.8 hours, and the
# triggers are spread through the day so a late or missing one is covered by the next.
# GitHub Actions is free and unmetered for a public repo.
#
# Caveat: GitHub disables scheduled workflows in a repo with no activity for 60 days
# (any push re-enables them).
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 5 * * *"
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}        # manual "Run workflow" button in the Actions tab

concurrency:
  group: keep-warm             # never two loops at once; a later trigger waits for the running one
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping for up to ~5.8 hours
        run: |
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt 21000 ]; do
            code=$(curl -s --max-time 120 -o /dev/null -w '%{http_code}' https://footiq-syqc.onrender.com/api/health || true)
            echo "$(date -u +%H:%M:%S) HTTP ${code:-none}"
            sleep 240
          done
