name: Keep Render instance warm (evenings only)

# Render's free tier sleeps a service after ~15 idle minutes, so the first visitor
# pays a cold start. This pings the app every 10 minutes ONLY during the hours it
# is actually used, then lets it sleep overnight.
#
# Budget (Render's free pool is 750 instance-hours per MONTH for the whole
# workspace, shared with the other projects):
#   5 hours/day x 30 days = ~150 hours/month   (an always-on instance is ~730)
# leaving ~600 hours for the other services and for real traffic outside the window.
# GitHub Actions is free and unmetered for a public repo, and each run takes a few seconds.
#
# Window: cron runs in UTC. 12:00-16:50 UTC = 17:30-22:20 IST.
# To move or widen it, change the hour range below and redo the maths above.
#
# Caveats: GitHub may delay or skip a scheduled run under load, and disables
# scheduled workflows in a repo with no activity for 60 days (any push re-enables).
on:
  schedule:
    - cron: "*/10 12-16 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live app
        # A cold start can take a minute+, so allow a long first request and one retry.
        run: curl -sf --max-time 120 --retry 1 --retry-delay 10 https://footiq.onrender.com/ -o /dev/null
