name: Keep Render instance warm

# Render's free tier spins the whole app down after ~15 min with no traffic,
# and the first request after that pays a real cold-start cost (matplotlib's
# font cache, the chart dataset objects, an uncached Wikipedia lookup all
# building at once) that can take 20+ seconds. Someone landing on the site
# after a quiet period has no way to know that's what's happening -- it just
# looks broken. A periodic ping from outside keeps a real request landing
# often enough that the instance never gets the chance to spin down, so real
# visitors almost never hit a cold one. Free either way (public repo =
# unlimited included Actions minutes), and this job is a few seconds each.
on:
  schedule:
    # Every 10 minutes requested -- but GitHub's scheduler is best-effort for
    # cron triggers and throttles low-traffic public repos hard: observed
    # actual gaps between runs on this repo were 2-5 HOURS, not 10 minutes.
    # That's far longer than Render's ~15 min spin-down window, so this alone
    # does not reliably keep the instance warm -- see the app's own startup
    # warm-up (app.py) for the fix that matters regardless of ping cadence,
    # and use a real uptime monitor (UptimeRobot free tier etc.) for anything
    # that actually needs a precise 5 min interval.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # manual "Run workflow" button in the Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live app
        # 90s not 30s -- a cold Render instance can take longer than 30s to
        # finish spinning up and responding, and curl reporting a timeout as
        # a workflow "failure" was misleading: the request still reaches
        # Render and the instance keeps booting either way, so a too-short
        # timeout just makes a real wake-up look like a broken job.
        run: curl -sf --max-time 90 https://footiq.onrender.com/ -o /dev/null
